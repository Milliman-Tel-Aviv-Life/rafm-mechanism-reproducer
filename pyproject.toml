[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rafm-reproducer"
version = "0.1.0"
description = "RAFM mechanism-to-Excel reproducer"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35",
    "openai>=1.30",
    "anthropic>=1.0",
    "instructor>=1.3",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed by scripts/extract_hierarchy_from_pdf.py — not used by the app itself.
pdf = ["pymupdf>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/rafm_reproducer"]
